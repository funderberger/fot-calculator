# Источники дайджеста по технопаркам.
# type: rss  — обычный RSS/Atom
# Проверь каждый URL один раз (curl -sI <url>) перед боем: сайты меняют пути к фидам.

feeds:
  # --- Google News RSS: главная рабочая лошадка, не требует наличия фида у источника ---
  - name: "GN · science/technology/research park"
    url: "https://news.google.com/rss/search?q=%22science+park%22+OR+%22technology+park%22+OR+%22research+park%22+when:2d&hl=en-US&gl=US&ceid=US:en"
  # Голый "innovation hub" тащил благотворительные раздачи и жилые районы,
  # поэтому он теперь требует соседства с научно-технической лексикой.
  - name: "GN · innovation district"
    url: "https://news.google.com/rss/search?q=%22innovation+district%22+OR+%28%22innovation+hub%22+AND+%28science+OR+technology+OR+research+OR+campus%29%29+when%3A2d&hl=en-US&gl=US&ceid=US:en"
  - name: "GN · technopark / technopolis"
    url: "https://news.google.com/rss/search?q=technopark+OR+technopolis+OR+%22high-tech+park%22+when:2d&hl=en-US&gl=US&ceid=US:en"
  - name: "GN · deeptech campus / life science campus"
    url: "https://news.google.com/rss/search?q=%22life+science+campus%22+OR+%22deeptech+campus%22+OR+%22R%26D+campus%22+when:2d&hl=en-US&gl=US&ceid=US:en"
  - name: "GN · RU технопарки и ОЭЗ"
    url: "https://news.google.com/rss/search?q=%D1%82%D0%B5%D1%85%D0%BD%D0%BE%D0%BF%D0%B0%D1%80%D0%BA+OR+%22%D0%BE%D1%81%D0%BE%D0%B1%D0%B0%D1%8F+%D1%8D%D0%BA%D0%BE%D0%BD%D0%BE%D0%BC%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F+%D0%B7%D0%BE%D0%BD%D0%B0%22+when:2d&hl=ru&gl=RU&ceid=RU:ru"

  # --- Отраслевые ассоциации (первоисточники) ---
  - name: "IASP"
    url: "https://news.google.com/rss/search?q=site:iasp.ws+when:7d&hl=en-US&gl=US&ceid=US:en"
  # Свой фид aurp.net отдаёт невалидный XML (проверено в CI 16.09.2026),
  # поэтому берём через Google News.
  - name: "AURP (университетские research parks, США/Канада)"
    url: "https://news.google.com/rss/search?q=site:aurp.net+when:7d&hl=en-US&gl=US&ceid=US:en"
  - name: "UKSPA (научные парки Великобритании)"
    url: "https://www.ukspa.org.uk/feed/"
  - name: "EBN / EU|BIC (европейские бизнес-инновационные центры)"
    url: "https://ebn.eu/feed/"

  # --- Медиа по инновационной экономике ---
  # rss.xml отдаёт невалидный XML (проверено в CI 16.09.2026).
  - name: "Science|Business (научная политика ЕС)"
    url: "https://news.google.com/rss/search?q=site:sciencebusiness.net+when:7d&hl=en-US&gl=US&ceid=US:en"
  - name: "Sifted (европейские стартапы и хабы)"
    url: "https://sifted.eu/feed"
  - name: "EU-Startups"
    url: "https://www.eu-startups.com/feed/"
  - name: "Tech.eu"
    url: "https://tech.eu/feed/"
  - name: "OpenGov Asia (Азия, госцифра и хабы)"
    url: "https://opengovasia.com/feed/"

# Ключевые слова: материал попадает в дайджест, если найдено хоть одно.
# Пустой список = пропускать всё (для уже узкоспециализированных фидов это нормально).
keywords:
  - science park
  - technology park
  - research park
  - innovation district
  - innovation hub
  - technopark
  - technopolis
  - high-tech park
  - free economic zone
  - special economic zone
  - incubator
  - accelerator
  - R&D campus
  - life science campus
  - технопарк
  - технополис
  - особая экономическая зона
  - инновационный кластер

# Фиды, которые не фильтруем по ключевикам (уже целевые)
trust_all:
  - "IASP"
  - "AURP (университетские research parks, США/Канада)"
  - "UKSPA (научные парки Великобритании)"
  - "EBN / EU|BIC (европейские бизнес-инновационные центры)"

max_items: 10
lookback_hours: 26
