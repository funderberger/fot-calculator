name: technopark-digest

on:
  schedule:
    # 05:00 UTC = 08:00 МСК. Cron в GitHub Actions всегда в UTC.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # нужно для коммита seen.json (память об отправленных ссылках)

concurrency:
  group: technopark-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technopark-digest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-check
        run: python tests.py

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python digest.py

      # Новости уже отправлены; если не удалось сохранить память — это не повод
      # красить прогон в красное, просто в следующий раз возможен повтор.
      - name: Remember what was sent
        continue-on-error: true
        run: |
          git config user.name  "technopark-digest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "chore: update seen.json [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
